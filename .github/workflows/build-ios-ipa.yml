name: Build iOS IPA (unsigned)

on:
  workflow_dispatch:
  push:
    tags:
      - "ios-v*"

jobs:
  build-ipa:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build web app
        run: npm run build

      - name: Sync Capacitor iOS
        run: npx cap sync ios

      - name: Build unsigned .app archive
        run: |
          cd ios/App
          xcodebuild archive \
            -workspace App.xcworkspace \
            -scheme App \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath "$PWD/build/App.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Package .ipa
        run: |
          cd ios/App/build
          mkdir -p Payload
          cp -R App.xcarchive/Products/Applications/App.app Payload/
          zip -r TwinPath-unsigned.ipa Payload

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: TwinPath-unsigned-ipa
          path: ios/App/build/TwinPath-unsigned.ipa
          retention-days: 30
