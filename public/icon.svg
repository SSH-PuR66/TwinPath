<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 1024 1024"
>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111f"/>
      <stop offset="0.52" stop-color="#11152b"/>
      <stop offset="1" stop-color="#170b24"/>
    </linearGradient>

    <linearGradient id="leftOrb" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d9fbff"/>
      <stop offset="0.35" stop-color="#65e8ff"/>
      <stop offset="1" stop-color="#3376ff"/>
    </linearGradient>

    <linearGradient id="rightOrb" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff0fa"/>
      <stop offset="0.4" stop-color="#ff79bd"/>
      <stop offset="1" stop-color="#8b62ff"/>
    </linearGradient>

    <linearGradient id="path" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#65e8ff"/>
      <stop offset="0.5" stop-color="#8b7cff"/>
      <stop offset="1" stop-color="#ff79bd"/>
    </linearGradient>

    <radialGradient id="glow">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".7"/>
      <stop offset=".25" stop-color="#65e8ff" stop-opacity=".25"/>
      <stop offset="1" stop-color="#65e8ff" stop-opacity="0"/>
    </radialGradient>

    <filter id="softGlow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="22"/>
    </filter>

    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow
        dx="0"
        dy="28"
        stdDeviation="30"
        flood-color="#000000"
        flood-opacity=".42"
      />
    </filter>

    <clipPath id="rounded">
      <rect width="1024" height="1024" rx="228"/>
    </clipPath>
  </defs>

  <g clip-path="url(#rounded)">
    <rect width="1024" height="1024" fill="url(#background)"/>

    <circle
      cx="220"
      cy="170"
      r="320"
      fill="url(#glow)"
      opacity=".52"
    />

    <circle
      cx="870"
      cy="250"
      r="330"
      fill="#8b62ff"
      opacity=".12"
      filter="url(#softGlow)"
    />

    <path
      d="M146 675
         C260 524 340 512 456 638
         C518 704 566 704 628 638
         C744 512 824 524 938 675"
      fill="none"
      stroke="url(#path)"
      stroke-width="42"
      stroke-linecap="round"
      opacity=".34"
      filter="url(#softGlow)"
    />

    <g filter="url(#shadow)">
      <circle
        cx="376"
        cy="460"
        r="157"
        fill="#0a1222"
        stroke="url(#leftOrb)"
        stroke-width="34"
      />

      <circle
        cx="648"
        cy="460"
        r="157"
        fill="#0a1222"
        stroke="url(#rightOrb)"
        stroke-width="34"
      />

      <circle
        cx="376"
        cy="460"
        r="112"
        fill="url(#leftOrb)"
      />

      <circle
        cx="648"
        cy="460"
        r="112"
        fill="url(#rightOrb)"
      />

      <ellipse
        cx="337"
        cy="420"
        rx="35"
        ry="27"
        fill="#ffffff"
        opacity=".54"
      />

      <ellipse
        cx="609"
        cy="420"
        rx="35"
        ry="27"
        fill="#ffffff"
        opacity=".5"
      />
    </g>

    <path
      d="M512 754
         C447 704 374 648 374 582
         C374 533 412 499 458 499
         C481 499 500 509 512 527
         C524 509 543 499 566 499
         C612 499 650 533 650 582
         C650 648 577 704 512 754Z"
      fill="url(#path)"
      stroke="#ffffff"
      stroke-opacity=".18"
      stroke-width="10"
      filter="url(#shadow)"
    />

    <circle cx="512" cy="754" r="12" fill="#ffffff" opacity=".82"/>

    <path
      d="M310 825 H714"
      stroke="url(#path)"
      stroke-width="18"
      stroke-linecap="round"
      opacity=".7"
    />
  </g>
</svg>
