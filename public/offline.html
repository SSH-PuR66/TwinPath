<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#07111f" />
    <title>TwinPath is offline</title>
    <style>
      :root { color-scheme: dark; font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #07111f; color: #f5f7ff; }
      body { display: grid; min-height: 100vh; margin: 0; padding: 24px; place-items: center; background: radial-gradient(circle at top, #1a3150, #07111f 54%); }
      main { width: min(100%, 430px); padding: 28px; text-align: center; background: rgba(11, 20, 35, .84); border: 1px solid rgba(255,255,255,.14); border-radius: 24px; box-shadow: 0 20px 70px rgba(0,0,0,.32); }
      h1 { margin: 0 0 10px; font-size: 1.5rem; } p { margin: 0; color: #b4c0d4; line-height: 1.55; } button { margin-top: 20px; padding: 12px 16px; color: #07111f; font: inherit; font-weight: 800; cursor: pointer; background: #65e8ff; border: 0; border-radius: 14px; }
    </style>
  </head>
  <body>
    <main>
      <h1>TwinPath is offline</h1>
      <p>Your last loaded screens remain available when cached. Reconnect to securely sync new changes and financial updates.</p>
      <button type="button" onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
